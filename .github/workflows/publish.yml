name: Publish to DockerHub

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  release:
    types:
       - published

env:
  DOCKER_USER: ${{ vars.DOCKER_USER }}

jobs:
  push:
    runs-on: codebuild-HarmonyDockerBuildGithubRunner-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # checkout the commit for the tag

      - name: Copy prebuilt lib from S3
        run: |
          aws s3 cp s3://harmony-github-workflow-support/libs/gdal-async-linux-arm64.tar.gz ./services/harmony/gdal-async-linux-arm64.tar.gz

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.x
          cache: 'npm'
          cache-dependency-path: |
            **/package-lock.json
            packages/*/package-lock.json
            services/*/package-lock.json

      - name: Log into registry
        run: echo "${{ secrets.DOCKERHUB }}" | docker login -u "${DOCKER_USER}" --password-stdin

      - name: Install npm Packages
        run: |
          npm install

      - name: Build and publish multi-arch images
        run: |
          # For tagged versions, translate e.g. "refs/tags/v1.2.3" -> "1.2.3"
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')

          # For the main branch, use "latest" as the version
          [ "${VERSION}" == "main" ] && VERSION=latest

          # build and publish images for all services
          VERSION="${VERSION}" ./node_modules/.bin/lerna run build-multi

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Tag stable images
        run: |
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION '${VERSION}' is not a semantic version; skipping stable tag."
            exit 0
          fi

          if ! command -v jq &> /dev/null; then
            if command -v apt-get &> /dev/null; then
              sudo apt-get update -y && sudo apt-get install -y jq
            elif command -v yum &> /dev/null; then
              sudo yum install -y jq
            else
              echo "jq is required but not installed, and no supported package manager was found to install it" >&2
              exit 1
            fi
          fi

          for service in harmony query-cmr service-runner work-failer cron-service work-scheduler work-updater; do
            image="harmonyservices/${service}"
            source_ref="docker.io/${image}:${VERSION}"

            # Build the tag from only the real platform manifests, excluding attestation
            # manifests (Platform: unknown/unknown) -- imagetools create mishandles OCI
            # indexes containing attestations and can collapse them to a single platform
            platform_refs=()
            while IFS= read -r digest; do
                platform_refs+=("${source_ref}@${digest}")
            done < <(docker buildx imagetools inspect "$source_ref" --raw \
                | jq -r 'if has("manifests") then .manifests[] | select(.platform.architecture != "unknown") | .digest else empty end')

            # Single-platform images have no manifest list to filter -- tag the source ref as-is
            if [ "${#platform_refs[@]}" -eq 0 ]; then
                platform_refs=("${source_ref}")
            fi

            docker buildx imagetools create "${platform_refs[@]}" --tag "docker.io/${image}:stable"
          done
