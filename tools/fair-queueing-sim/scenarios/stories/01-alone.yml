# Story 1: a single user has the service to themselves and should get all of it.
name: 01-alone
description: >-
  Alice is the only user, with one async job of 600 granules whose work items take about two
  minutes each, on a service with 20 pods. She should get the whole service (goal 1 of fair
  queueing).
seed: 1
maxDuration: 1d
env:
  # the SQS long polling fix from harmony-2413 (de861316b) - independent of the fair queueing policy
  QUEUE_LONG_POLLING_WAIT_TIME_SEC: 3
services:
  - name: svc
    pods: 20
jobs:
  - name: alice-big
    user: alice
    granules: 600
    steps:
      - service: svc
        duration: { dist: lognormal, median: 2m, sigma: 0.3 }
